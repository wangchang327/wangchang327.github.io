<p class="post-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    · <span class="meta-label">{{ partial "blog/icon.html" "clock" }} {{ .ReadingTime }} min</span>{{ if .Draft }} · Draft{{ end }}
    {{ if gt .Lastmod .Date }} · Updated <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "Jan 2, 2006" }}</time>{{ end }}
    {{ partial "blog/terms.html" . }}
</p>
