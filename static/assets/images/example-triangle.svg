<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="title desc">
    <title id="title">A right triangle</title>
    <desc id="desc">The perpendicular legs are labelled a and b; the hypotenuse is labelled c.</desc>
    <rect width="480" height="300" fill="white"/>
    <path d="M90 50V240H390Z M90 216H114V240" fill="none" stroke="#222" stroke-width="2"/>
    <g fill="#222" font-family="Crimson Text, serif" font-size="26" font-style="italic" text-anchor="middle">
        <text x="65" y="153">a</text>
        <text x="240" y="278">b</text>
        <text x="255" y="137">c</text>
    </g>
</svg>
