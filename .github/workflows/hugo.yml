name: Build and deploy
'on':
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
    group: pages
    cancel-in-progress: false
defaults:
    run:
        shell: bash
jobs:
    build:
        runs-on: ubuntu-latest
        env:
            HUGO_VERSION: 0.161.1
            TZ: America/Chicago
        steps:
            -
                name: Checkout
                uses: actions/checkout@v6
            -
                name: Setup Pages
                id: pages
                uses: actions/configure-pages@v6
            -
                name: Install Hugo
                run: |
                    mkdir -p "$RUNNER_TEMP/hugo-bin"
                    curl --fail --silent --show-error --location \
                        "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
                        --output "$RUNNER_TEMP/hugo.tar.gz"
                    tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin"
                    echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
            -
                name: Build the site
                run: |
                    hugo --minify --cleanDestinationDir \
                        --baseURL "${{ steps.pages.outputs.base_url }}/" \
                        --cacheDir "$RUNNER_TEMP/hugo_cache"
            -
                name: Upload artifact
                uses: actions/upload-pages-artifact@v5
                with:
                    path: ./public
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            -
                name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@v5
